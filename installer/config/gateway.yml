llm:
  port: 4000
  models:
  - name: smart
    visibility: public
    provider:
      reference: euc
    params:
      model: gemma-4-26b-a4b
  - name: fast
    visibility: public
    provider:
      reference: euc
    params:
      model: gemma-4-e2b
  - name: '*'
    provider:
      reference: euc
  providers:
  - name: euc
    provider:
      custom:
        formats:
        - type: completions
        - type: responses
    params:
      baseUrl: http://localhost:11434/v1
  policies:
    guardrails:
      request:
      - regex:
          action: mask
          rules:
          - builtin: email
          - builtin: phoneNumber
          - builtin: creditCard
          - builtin: ssn
          - builtin: caSin
    cors:
      allowOrigins:
      - '*'
      allowMethods:
      - '*'
      allowHeaders:
      - '*'
      exposeHeaders:
      - mcp-session-id
      - x-request-id
binds:
- port: 3010
  listeners:
  - protocol: HTTP
    name: listener
    routes:
    - backends:
      - mcp:
          targets:
          - name: mcp-registry
            openapi:
              host: https://registry.modelcontextprotocol.io
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/mcp-registry-api.json
          - name: countries
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/countries.json
              host: https://restcountries.com
          - name: country-is
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/country-is.json
              host: https://api.country.is/
          - name: ip-geolocation
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/ipapi-is.json
              host: https://api.ipapi.is
          - name: my-ip
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/myip-com.json
              host: https://api.myip.com
          - name: surise-sunset
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/sunrise-sunset.json
              host: https://api.sunrise-sunset.org
          - name: uv-index
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/current-uv-index.json
              host: https://currentuvindex.com/api/v1
          - name: weather
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/open-meteo.json
              host: https://api.open-meteo.com
          - name: holidays
            openapi:
              host: https://date.nager.at
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/date-nager-api-v3.json
          statefulMode: stateless
          prefixMode: always
      name: services
      policies:
        cors:
          allowOrigins:
          - '*'
          allowHeaders:
          - '*'
          exposeHeaders:
          - Mcp-Session-Id
- port: 3011
  listeners:
  - protocol: HTTP
    name: listener
    routes:
    - backends:
      - mcp:
          targets:
          - name: jobicy
            openapi:
              host: https://jobicy.com
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/jobicy.json
          - name: jobrise
            openapi:
              host: https://api.jobrise.io
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/jobrise.json
          statefulMode: stateless
          prefixMode: always
      name: careers
      policies:
        cors:
          allowOrigins:
          - '*'
          allowHeaders:
          - '*'
          exposeHeaders:
          - Mcp-Session-Id
- port: 3012
  listeners:
  - protocol: HTTP
    name: listener
    routes:
    - backends:
      - mcp:
          targets:
          - name: met-museum
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/metmuseum.json
              host: https://collectionapi.metmuseum.org/public/collection/v1
          - name: musicbrainz
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/musicbrainz.json
              host: https://musicbrainz.org/ws/2
          - name: song-lyrics
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/lrclib.json
              host: https://lrclib.net
          - name: tv-movies
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/tvmaze-com.json
              host: https://api.tvmaze.com
          statefulMode: stateless
          prefixMode: always
      name: media
      policies:
        cors:
          allowOrigins:
          - '*'
          allowHeaders:
          - '*'
          exposeHeaders:
          - Mcp-Session-Id
- port: 3013
  listeners:
  - protocol: HTTP
    name: listener
    routes:
    - backends:
      - mcp:
          targets:
          - name: nameday
            openapi:
              schema:
                url: https://raw.githubusercontent.com/sheldonrobinson/studious-sniffle/refs/heads/main/openapi/nameday.json
              host: https://nameday.abalin.net/api
          - name: sportsdb
            openapi:
              schema:
                url: https://www.thesportsdb.com/api/spec/v2/openapi.yaml
              host: https://www.thesportsdb.com/api/v2/json
          statefulMode: stateless
          prefixMode: always
      name: culture
      policies:
        cors:
          allowOrigins:
          - '*'
          allowHeaders:
          - '*'
          exposeHeaders:
          - Mcp-Session-Id
mcp:
  port: 3000
  targets:
  - name: services
    mcp:
      host: http://localhost:3010/mcp
  - name: careers
    mcp:
      host: http://localhost:3011/mcp
  - name: media
    mcp:
      host: http://localhost:3012/mcp
  - name: culture
    mcp:
      host: http://localhost:3013/mcp
  policies:
    cors:
      allowOrigins:
      - '*'
      - http://localhost:15000
      allowMethods:
      - '*'
      - GET
      - POST
      allowHeaders:
      - '*'
      exposeHeaders:
      - Mcp-Session-Id
  statefulMode: stateless
  prefixMode: always
  failureMode: failClosed
config:
  logging:
    level: info
    format: json
